global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'commerce-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'commerce-api'

  - job_name: 'commerce-streamer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8093']
        labels:
          application: 'commerce-streamer'